    - id: "issue-tech-debt"
      name: "📉 Technical Debt"
      color: "f9d0c4"
      description: "Tasks related to addressing shortcuts or temporary fixes that need improvement."
      category: "issue_type"
      value: "technical_debt"
      priority_default: "low"

  # Programming Languages
  languages:
    - id: "lang-javascript"
      name: "JavaScript"
      color: "f1e05a"
      description: "JavaScript and TypeScript related changes."
      category: "language"
      value: "javascript"
      skills: ["javascript", "typescript", "es6", "nodejs"]
    - id: "lang-python"
