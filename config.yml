# Issue Templates Configuration
templates:
  feature_request:
    enabled: true
    filename: "feature_request.md"
    title_prefix: "[FEATURE] "
    default_labels: ["✨ Feature"]

  bug_report:
    enabled: true
    filename: "general_bug_report.md"
    title_prefix: "[BUG] "
    default_labels: ["🪲 Bug"]

  performance_issue:
    enabled: true
    filename: "performance_bug.md"
    title_prefix: "[PERFORMANCE] "
    default_labels: ["🪲 Bug"]

# Settings
settings:
  # Whether to create labels automatically
  create_labels: true
  
  # Whether to create issue templates automatically
  create_templates: true
  
  # Whether to auto-label issues based on content
  auto_label_issues: true
  
  # Whether to overwrite existing labels (false = skip if exists)
  overwrite_labels: false
  
  # Whether to overwrite existing templates (false = skip if exists)
  overwrite_templates: false 