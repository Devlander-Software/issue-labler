# Issue Labler Configuration
# This file allows you to customize the labels and templates created by the action

# Label Categories - Organized for easy filtering and analysis
labels:
  # Release Phases
  release_phases:
    - id: "release-prelease"
      name: "1️⃣ Prelease"
      color: "006b75"
      description: "Tasks for the pre-MVP release with only the bare minimum to launch, without customer validation."
      category: "release_phase"
      value: "prelease"
    - id: "release-mvp"
      name: "2️⃣ MVP"
      color: "0075ca"
      description: "Tasks for the initial MVP release, focusing on core features and validation."
      category: "release_phase"
      value: "mvp"
    - id: "release-post"
      name: "3️⃣ Post Release"
      color: "28a745"
      description: "Tasks for improving the product after MVP launch, based on feedback from signed-up users."
      category: "release_phase"
      value: "post_release"

  # Story Points - For effort estimation and sprint planning
  story_points:
    - id: "story-points-1"
      name: "⏳ Story Points: 1"
      color: "6f42c1"
      description: "Estimated effort: 1-2 hours."
      category: "story_points"
      value: 1
      hours_min: 1
      hours_max: 2
    - id: "story-points-2-3"
      name: "⏳ Story Points: 2-3"
      color: "ffdf5d"
      description: "Estimated effort: 2-4 hours."
      category: "story_points"
      value: 2.5
      hours_min: 2
      hours_max: 4
    - id: "story-points-5"
      name: "⏳ Story Points: 5"
      color: "ff7800"
      description: "Estimated effort: 5-8 hours."
      category: "story_points"
      value: 5
      hours_min: 5
      hours_max: 8
    - id: "story-points-8"
      name: "⏳ Story Points: 8"
      color: "d73a4a"
      description: "Estimated effort: 10-16 hours."
      category: "story_points"
      value: 8
      hours_min: 10
      hours_max: 16
    - id: "story-points-13"
      name: "⏳ Story Points: 13"
      color: "a29bfe"
      description: "Estimated effort: 16+ hours."
      category: "story_points"
      value: 13
      hours_min: 16
      hours_max: 40
    - id: "story-points-20-plus"
      name: "⏳ Story Points: 20+"
      color: "000000"
      description: "Estimated effort: 40+ hours."
      category: "story_points"
      value: 20
      hours_min: 40
      hours_max: 999

  # Difficulty Levels - For resource allocation and skill matching
  difficulty:
    - id: "difficulty-simple"
      name: "🌱 Difficulty: Simple"
      color: "0e8a16"
      description: "Basic tasks with minimal complexity."
      category: "difficulty"
      value: "simple"
      skill_level: "junior"
      complexity_score: 1
    - id: "difficulty-easy"
      name: "👍 Difficulty: Easy"
      color: "f9d0c4"
      description: "Low-complexity tasks, typically straightforward."
      category: "difficulty"
      value: "easy"
      skill_level: "junior"
      complexity_score: 2
    - id: "difficulty-moderate"
      name: "🛠️ Difficulty: Moderate"
      color: "ffdf5d"
      description: "Tasks of medium complexity affecting multiple components."
      category: "difficulty"
      value: "moderate"
      skill_level: "mid"
      complexity_score: 3
    - id: "difficulty-hard"
      name: "🔥 Difficulty: Hard"
      color: "d73a4a"
      description: "High-complexity tasks involving significant changes."
      category: "difficulty"
      value: "hard"
      skill_level: "senior"
      complexity_score: 4
    - id: "difficulty-very-hard"
      name: "🧠 Difficulty: Very Hard"
      color: "5319e7"
      description: "Advanced tasks requiring deep expertise or extensive work."
      category: "difficulty"
      value: "very_hard"
      skill_level: "senior"
      complexity_score: 5
    - id: "difficulty-epic"
      name: "⚫ Difficulty: Epic"
      color: "000000"
      description: "Large, multi-phase tasks or projects requiring significant effort."
      category: "difficulty"
      value: "epic"
      skill_level: "architect"
      complexity_score: 6

  # Priority Levels - For scheduling and resource allocation
  priority:
    - id: "priority-critical"
      name: "🚨 Priority: Critical"
      color: "e11d21"
      description: "Urgent tasks that must be handled immediately to avoid major problems or system failure."
      category: "priority"
      value: "critical"
      urgency_score: 4
      business_impact: "high"
    - id: "priority-high"
      name: "🚨 Priority: High"
      color: "fbca04"
      description: "Requires timely attention. May cause larger issues if not addressed soon."
      category: "priority"
      value: "high"
      urgency_score: 3
      business_impact: "high"
    - id: "priority-medium"
      name: "🚨 Priority: Medium"
      color: "fef2c0"
      description: "Important tasks, but not urgent. Should be addressed after high-priority items."
      category: "priority"
      value: "medium"
      urgency_score: 2
      business_impact: "medium"
    - id: "priority-low"
      name: "🚨 Priority: Low"
      color: "c2e0c6"
      description: "Tasks with minimal impact. Can be handled when there's free time."
      category: "priority"
      value: "low"
      urgency_score: 1
      business_impact: "low"

  # Development Areas - For team assignment and skill matching
  development_areas:
    - id: "dev-frontend"
      name: "🎨 Client Side"
      color: "1b6b91"
      description: "Tasks related to frontend development, such as UI/UX or component design."
      category: "development_area"
      value: "frontend"
      team: "frontend"
      skills: ["react", "vue", "angular", "css", "html", "javascript"]
    - id: "dev-backend"
      name: "🖥️ Backend"
      color: "6e5494"
      description: "Tasks related to backend development, such as APIs, databases, or server logic."
      category: "development_area"
      value: "backend"
      team: "backend"
      skills: ["nodejs", "python", "java", "sql", "api", "database"]
    - id: "dev-infrastructure"
      name: "☁️ Cloud Infrastructure"
      color: "ffd33d"
      description: "Tasks involving AWS services such as EC2, S3, RDS, Lambda, and other cloud-based infrastructure."
      category: "development_area"
      value: "infrastructure"
      team: "devops"
      skills: ["aws", "docker", "kubernetes", "terraform", "ci/cd"]
    - id: "dev-devops"
      name: "⚙️ DevOps"
      color: "6f42c1"
      description: "Tasks associated with development operations, including automation, CI/CD, and infrastructure management."
      category: "development_area"
      value: "devops"
      team: "devops"
      skills: ["jenkins", "github-actions", "docker", "monitoring", "deployment"]
    - id: "dev-ui-components"
      name: "👩‍💻 Component/UI"
      color: "c5def5"
      description: "Tasks for developing or designing individual UI components, focusing on reusable elements."
      category: "development_area"
      value: "ui_components"
      team: "frontend"
      skills: ["react", "vue", "angular", "design-systems", "accessibility"]
    - id: "dev-business-logic"
      name: "🧠 Logic/Functions"
      color: "6e5494"
      description: "Tasks for implementing behind-the-scenes business logic and functions, not related to visuals."
      category: "development_area"
      value: "business_logic"
      team: "backend"
      skills: ["algorithms", "data-structures", "business-logic", "api-design"]

  # Platform Specific - For mobile and platform-specific development
  platforms:
    - id: "platform-ios"
      name: "🍎 Platform-Specific: iOS"
      color: "2ea44f"
      description: "Tasks specific to iOS development, including iPhone/iPad features and compatibility."
      category: "platform"
      value: "ios"
      team: "mobile"
      skills: ["swift", "objective-c", "ios", "xcode", "app-store"]
    - id: "platform-android"
      name: "🤖 Platform-Specific: Android"
      color: "4c1a95"
      description: "Tasks related to Android-specific development and compatibility."
      category: "platform"
      value: "android"
      team: "mobile"
      skills: ["kotlin", "java", "android", "android-studio", "google-play"]

  # Testing & Quality Assurance
  testing:
    - id: "testing-unit"
      name: "🔬 Testing: Unit"
      color: "e7e7e7"
      description: "Tasks focused on writing or running unit tests for individual components."
      category: "testing"
      value: "unit"
      team: "qa"
      skills: ["jest", "mocha", "pytest", "unit-testing"]
    - id: "testing-integration"
      name: "🧩 Testing: Integration"
      color: "f9d0c4"
      description: "Tasks for ensuring that different parts of the system work together as expected."
      category: "testing"
      value: "integration"
      team: "qa"
      skills: ["integration-testing", "api-testing", "end-to-end"]
    - id: "testing-e2e"
      name: "🌐 Testing: End-to-End"
      color: "a2eeef"
      description: "Tasks involving tests that validate the entire application flow from start to finish."
      category: "testing"
      value: "e2e"
      team: "qa"
      skills: ["cypress", "selenium", "playwright", "e2e-testing"]
    - id: "testing-qa"
      name: "🔬 QA/Automation"
      color: "2db1eb"
      description: "Tasks involving writing, updating, or automating tests to ensure code quality."
      category: "testing"
      value: "qa"
      team: "qa"
      skills: ["test-automation", "quality-assurance", "manual-testing"]

  # Documentation
  documentation:
    - id: "docs-updates"
      name: "📚 Documentation: Updates"
      color: "6c757d"
      description: "Tasks involving updates or improvements to existing documentation."
      category: "documentation"
      value: "updates"
      team: "documentation"
      skills: ["technical-writing", "markdown", "documentation"]
    - id: "docs-new"
      name: "📝 Documentation: New"
      color: "0052cc"
      description: "Tasks focused on creating entirely new documentation."
      category: "documentation"
      value: "new"
      team: "documentation"
      skills: ["technical-writing", "markdown", "documentation"]

  # Maintenance & Operations
  maintenance:
    - id: "maintenance-dependencies"
      name: "🔄 Maintenance: Dependency Update"
      color: "0366d6"
      description: "Tasks related to updating project dependencies like libraries or frameworks."
      category: "maintenance"
      value: "dependencies"
      team: "devops"
      skills: ["dependency-management", "security-updates", "version-control"]
    - id: "maintenance-chore"
      name: "🧹 Maintenance: Chore"
      color: "e4e669"
      description: "Routine maintenance tasks that are required for upkeep but don't add features."
      category: "maintenance"
      value: "chore"
      team: "devops"
      skills: ["maintenance", "housekeeping", "cleanup"]

  # Deployment & Release
  deployment:
    - id: "deploy-testflight"
      name: "🚀 Deployment: TestFlight Release"
      color: "0366d6"
      description: "Tasks related to preparing and rolling updates to TestFlight for beta testing."
      category: "deployment"
      value: "testflight"
      team: "mobile"
      skills: ["ios", "testflight", "beta-testing", "app-store-connect"]
    - id: "deploy-app-store"
      name: "🏬 Deployment: App Store Release"
      color: "ffdf5d"
      description: "Tasks related to preparing and submitting updates to the App Store."
      category: "deployment"
      value: "app_store"
      team: "mobile"
      skills: ["ios", "app-store", "release-management", "app-store-connect"]
    - id: "deploy-google-play"
      name: "📱 Deployment: Google Play Release"
      color: "a4f9e0"
      description: "Tasks related to submitting updates to Google Play for Android users."
      category: "deployment"
      value: "google_play"
      team: "mobile"
      skills: ["android", "google-play", "release-management", "play-console"]

  # Validation & Testing
  validation:
    - id: "validation-testflight"
      name: "🧪 Validation: TestFlight"
      color: "fbca04"
      description: "Tasks related to validating features and collecting feedback from TestFlight users."
      category: "validation"
      value: "testflight"
      team: "qa"
