# Issue Labler Configuration
# This file allows you to customize the labels and templates created by the action

# GitHub Issue Type Field Configuration
github_issue_types:
  - name: "Bug"
    description: "Something is not working correctly"
    color: "d73a4a"
    icon: "🪲"
    default_priority: "high"
    
  - name: "Feature"
    description: "New functionality or enhancement"
    color: "663399"
    icon: "✨"
    default_priority: "medium"
    
  - name: "Task"
    description: "General work item or maintenance"
    color: "0366d6"
    icon: "📋"
    default_priority: "low"
    
  - name: "Performance"
    description: "Performance optimization or speed improvements"
    color: "ffd33d"
    icon: "🚀"
    default_priority: "high"
    
  - name: "Technical Debt"
    description: "Code improvements and refactoring"
    color: "f9d0c4"
    icon: "📉"
    default_priority: "low"

# Label Application Rules by Issue Type
label_rules:
  bug:
    required_labels: ["🚨 Priority: High"]
    available_labels:
      - all_priorities
      - all_story_points
      - all_difficulties
      - all_development_areas
      - all_platforms
      - all_testing
      - all_languages
      - qa_automation
    
  feature:
    required_labels: ["🚨 Priority: Medium"]
    available_labels:
      - medium_high_low_priorities
      - all_story_points
      - all_difficulties
      - all_development_areas
      - all_platforms
      - all_testing
      - all_languages
      - documentation_new
    
  task:
    required_labels: ["🚨 Priority: Low"]
    available_labels:
      - low_medium_priorities
      - small_story_points
      - simple_moderate_difficulties
      - all_development_areas
      - all_languages
      - documentation_updates
      - maintenance_labels
    
  performance:
    required_labels: ["🚨 Priority: High"]
    available_labels:
      - high_medium_priorities
      - large_story_points
      - hard_very_hard_epic_difficulties
      - frontend_backend_infrastructure
      - all_languages
      - unit_integration_testing
      - qa_automation
    
  technical_debt:
    required_labels: ["🚨 Priority: Low"]
    available_labels:
      - low_medium_priorities
      - medium_story_points
      - moderate_very_hard_difficulties
      - all_development_areas
      - all_languages
      - unit_integration_testing

# Label Categories - Organized for easy filtering and analysis
labels:
  # Release Phases
  release_phases:
    - id: "release-prelease"
      name: "1️⃣ Prelease"
      color: "006b75"
      description: "Tasks for the pre-MVP release with only the bare minimum to launch, without customer validation."
      category: "release_phase"
      value: "prelease"
    - id: "release-mvp"
      name: "2️⃣ MVP"
      color: "0075ca"
      description: "Tasks for the initial MVP release, focusing on core features and validation."
      category: "release_phase"
      value: "mvp"
    - id: "release-post"
      name: "3️⃣ Post Release"
      color: "28a745"
      description: "Tasks for improving the product after MVP launch, based on feedback from signed-up users."
      category: "release_phase"
      value: "post_release"

  # Story Points - For effort estimation and sprint planning
  story_points:
    - id: "story-points-1"
      name: "⏳ Story Points: 1"
      color: "6f42c1"
      description: "Estimated effort: 1-2 hours."
      category: "story_points"
      value: 1
      hours_min: 1
      hours_max: 2
    - id: "story-points-2-3"
      name: "⏳ Story Points: 2-3"
      color: "ffdf5d"
      description: "Estimated effort: 2-4 hours."
      category: "story_points"
      value: 2.5
      hours_min: 2
      hours_max: 4
    - id: "story-points-5"
      name: "⏳ Story Points: 5"
      color: "ff7800"
      description: "Estimated effort: 5-8 hours."
      category: "story_points"
      value: 5
      hours_min: 5
      hours_max: 8
    - id: "story-points-8"
      name: "⏳ Story Points: 8"
      color: "d73a4a"
      description: "Estimated effort: 10-16 hours."
      category: "story_points"
      value: 8
      hours_min: 10
      hours_max: 16
    - id: "story-points-13"
      name: "⏳ Story Points: 13"
      color: "a29bfe"
      description: "Estimated effort: 16+ hours."
      category: "story_points"
      value: 13
      hours_min: 16
      hours_max: 40
    - id: "story-points-20-plus"
      name: "⏳ Story Points: 20+"
      color: "000000"
      description: "Estimated effort: 40+ hours."
      category: "story_points"
      value: 20
      hours_min: 40
      hours_max: 999

  # Difficulty Levels - For resource allocation and skill matching
  difficulty:
    - id: "difficulty-simple"
      name: "🌱 Difficulty: Simple"
      color: "0e8a16"
      description: "Basic tasks with minimal complexity."
      category: "difficulty"
      value: "simple"
      skill_level: "junior"
      complexity_score: 1
    - id: "difficulty-easy"
      name: "👍 Difficulty: Easy"
      color: "f9d0c4"
      description: "Low-complexity tasks, typically straightforward."
      category: "difficulty"
      value: "easy"
      skill_level: "junior"
      complexity_score: 2
    - id: "difficulty-moderate"
      name: "🛠️ Difficulty: Moderate"
      color: "ffdf5d"
      description: "Tasks of medium complexity affecting multiple components."
      category: "difficulty"
      value: "moderate"
      skill_level: "mid"
      complexity_score: 3
    - id: "difficulty-hard"
      name: "🔥 Difficulty: Hard"
      color: "d73a4a"
      description: "High-complexity tasks involving significant changes."
      category: "difficulty"
      value: "hard"
      skill_level: "senior"
      complexity_score: 4
    - id: "difficulty-very-hard"
      name: "🧠 Difficulty: Very Hard"
      color: "5319e7"
      description: "Advanced tasks requiring deep expertise or extensive work."
      category: "difficulty"
      value: "very_hard"
      skill_level: "senior"
      complexity_score: 5
    - id: "difficulty-epic"
      name: "⚫ Difficulty: Epic"
      color: "000000"
      description: "Large, multi-phase tasks or projects requiring significant effort."
      category: "difficulty"
      value: "epic"
      skill_level: "architect"
      complexity_score: 6

  # Priority Levels - For scheduling and resource allocation
  priority:
    - id: "priority-critical"
      name: "🚨 Priority: Critical"
      color: "e11d21"
      description: "Urgent tasks that must be handled immediately to avoid major problems or system failure."
      category: "priority"
      value: "critical"
      urgency_score: 4
      business_impact: "high"
    - id: "priority-high"
      name: "🚨 Priority: High"
      color: "fbca04"
      description: "Requires timely attention. May cause larger issues if not addressed soon."
      category: "priority"
      value: "high"
      urgency_score: 3
      business_impact: "high"
    - id: "priority-medium"
      name: "🚨 Priority: Medium"
      color: "fef2c0"
      description: "Important tasks, but not urgent. Should be addressed after high-priority items."
      category: "priority"
