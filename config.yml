# Template Configuration - Centralized template generation
templates:
  # Common sections that can be reused across templates
  common_sections:
    story_points_section: |
      ## 📊 Effort Estimation
      **Select the estimated effort for this task:**

      - [ ] **Story Points: 1** (1-2 hours)
      - [ ] **Story Points: 2-3** (2-4 hours)
      - [ ] **Story Points: 5** (5-8 hours)
      - [ ] **Story Points: 8** (10-16 hours)
      - [ ] **Story Points: 13** (16+ hours)
      - [ ] **Story Points: 20+** (40+ hours)

    difficulty_section: |
      ## 🎯 Complexity Assessment
      **Select the complexity level:**

      - [ ] **Difficulty: Simple** (Basic tasks with minimal complexity)
      - [ ] **Difficulty: Easy** (Low-complexity tasks, typically straightforward)
      - [ ] **Difficulty: Moderate** (Tasks of medium complexity affecting multiple components)
      - [ ] **Difficulty: Hard** (High-complexity tasks involving significant changes)
      - [ ] **Difficulty: Very Hard** (Advanced tasks requiring deep expertise or extensive work)
      - [ ] **Difficulty: Epic** (Large, multi-phase tasks or projects requiring significant effort)

    priority_section: |
      ## 🚨 Priority Level
      **Select the priority level:**

      - [ ] **Priority: Critical** (Urgent tasks that must be handled immediately)
      - [ ] **Priority: High** (Requires timely attention, may cause larger issues if not addressed soon)
      - [ ] **Priority: Medium** (Important tasks, but not urgent)
      - [ ] **Priority: Low** (Tasks with minimal impact, can be handled when there's free time)

    development_areas_section: |
      ## 🛠️ Development Areas
      **Select the areas this task affects:**

      - [ ] **🎨 Client Side** (Frontend development, UI/UX, components)
      - [ ] **🖥️ Backend** (APIs, databases, server logic)
      - [ ] **☁️ Cloud Infrastructure** (AWS, cloud services, infrastructure)
      - [ ] **⚙️ DevOps** (CI/CD, automation, deployment)
      - [ ] **👩‍💻 Component/UI** (UI components, design systems)
      - [ ] **🧠 Logic/Functions** (Business logic, algorithms, functions)

    testing_section: |
      ## 🧪 Testing Requirements
      **Select the testing types needed:**

      - [ ] **🔬 Testing: Unit** (Individual component tests)
      - [ ] **🧩 Testing: Integration** (Component interaction tests)
      - [ ] **🌐 Testing: End-to-End** (Full application flow tests)

    platform_section: |
      ## 📱 Platform Specific
      **Select the affected platforms:**

      - [ ] **🍎 Platform-Specific: iOS** (iPhone, iPad, Apple Watch)
      - [ ] **🤖 Platform-Specific: Android** (Android phones, tablets)

    deployment_section: |
      ## 🚀 Deployment & Validation
      **Select deployment and validation needs:**

      - [ ] **🏬 Deployment: App Store Release** (iOS app store deployment)
      - [ ] **📱 Deployment: Google Play Release** (Android play store deployment)
      - [ ] **🚀 Deployment: TestFlight Release** (iOS beta testing)
      - [ ] **🧪 Validation: TestFlight** (iOS beta validation)
      - [ ] **📱 Validation: Platform-Specific** (Platform-specific testing)

  # Template-specific sections
  template_sections:
    feature_request:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section
      - testing_section
      - platform_section

    bug_report:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section
      - testing_section
      - platform_section

    performance_bug:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section
      - platform_section

    documentation_request:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section

    technical_debt:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section

    mobile_platform_issue:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section
      - testing_section
      - deployment_section

    maintenance_task:
      - story_points_section
      - difficulty_section
      - priority_section
      - development_areas_section
      - testing_section

# Analysis and Reporting Configuration
analysis:
  # Metrics to track for reporting
  metrics:
    - story_points_by_team
    - difficulty_distribution
    - priority_distribution
    - platform_distribution
    - language_distribution
    - velocity_by_category
    - time_to_resolution
    - label_accuracy

  # Filters for data analysis
  filters:
    date_range: "last_30_days"
    teams: ["frontend", "backend", "mobile", "devops", "qa"]
    categories: ["story_points", "difficulty", "priority", "development_area"]
    platforms: ["ios", "android", "web"]

  # Export formats for data analysis
  export_formats:
    - csv
    - json
    - excel
    - powerbi

# Workflow Configuration
workflow:
  # Auto-labeling rules
  auto_label_rules:
    - name: "Story Points Detection"
      pattern: "Story Points: (\\d+[+]?)"
      labels: ["story_points"]
      confidence: 0.9

    - name: "Difficulty Detection"
      pattern: "Difficulty: (Simple|Easy|Moderate|Hard|Very Hard|Epic)"
      labels: ["difficulty"]
      confidence: 0.9

    - name: "Priority Detection"
      pattern: "Priority: (Critical|High|Medium|Low)"
      labels: ["priority"]
      confidence: 0.9

    - name: "Bug Detection"
      keywords: ["bug", "error", "crash", "broken", "fix", "issue"]
      labels: ["🪲 Bug"]
      confidence: 0.7

    - name: "Feature Detection"
      keywords: ["feature", "enhancement", "improvement", "new", "add", "implement"]
      labels: ["✨ Feature"]
      confidence: 0.7

  # File-based labeling rules
  file_based_rules:
    - pattern: "*.ts,*.tsx,*.js,*.jsx"
      labels: ["JavaScript"]
    - pattern: "*.py"
      labels: ["Python"]
    - pattern: "*.java"
      labels: ["Java"]
    - pattern: "*.swift"
      labels: ["Swift"]
    - pattern: "*.kt,*.kts"
      labels: ["Kotlin"]
    - pattern: "*.go"
      labels: ["Go"]
    - pattern: "*.rs"
      labels: ["Rust"]
    - pattern: "*.php"
      labels: ["PHP"]
    - pattern: "*.rb"
      labels: ["Ruby"]
    - pattern: "*.cs"
      labels: ["C#"] 