name: 'GitHub Auto-Label Issues & Templates'
description: 'Automatically create issue templates and apply intelligent labels based on content and file changes'
author: 'Devlander Software'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  create_templates:
    description: 'Whether to create issue templates'
    required: false
    default: 'true'
  create_labels:
    description: 'Whether to create labels'
    required: false
    default: 'true'
  auto_label_issues:
    description: 'Whether to automatically label issues'
    required: false
    default: 'true'
  rate_limit_delay:
    description: 'Delay between API calls to avoid rate limits'
    required: false
    default: '0.5'
  max_retries:
    description: 'Maximum number of retries for failed operations'
    required: false
    default: '3'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Issue Templates
      run: npm run generate:templates
      
    - name: Create Labels
      run: npm run create:labels
      
    - name: Auto-label Issues
      run: npm run auto:label
      if: ${{ inputs.auto_label_issues == 'true' }}

